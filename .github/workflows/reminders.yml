# Déclenche les rappels Aimora toutes les heures.
# (Vercel Hobby n'autorise que des crons quotidiens : on appelle donc la route depuis GitHub.)
# Chaque utilisateur reçoit son rappel à l'heure locale qu'il a choisie ; la route gère
# elle-même les doublons et le rattrapage (3 h) si une exécution est retardée.
#
# Configuration requise : Settings > Secrets and variables > Actions
#   - onglet "Secrets"  > "New repository secret" : CRON_SECRET (même valeur que sur Vercel)
#   - onglet "Secrets" (ou "Variables") : APP_URL, ex. https://aimora.vercel.app
name: Rappels Aimora

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Appeler la route des rappels
        env:
          # APP_URL n'est pas sensible : accepté en secret ou en variable.
          APP_URL: ${{ secrets.APP_URL || vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          missing=0
          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL est vide. Crée-le dans Settings > Secrets and variables > Actions (secret de dépôt, ou variable)."
            missing=1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET est vide. Crée-le comme *Repository secret* (onglet Secrets, pas Variables, pas Environment) avec la même valeur que sur Vercel."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1

          case "$APP_URL" in
            http://*|https://*) ;;
            *) echo "::error::APP_URL doit commencer par https:// (valeur reçue : $APP_URL)"; exit 1 ;;
          esac

          status=$(curl --silent --show-error --retry 3 --retry-delay 10 \
            --output response.json --write-out "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/morning-reminders")
          echo "HTTP $status"
          cat response.json; echo
          case "$status" in
            2*) ;;
            401) echo "::error::401 : CRON_SECRET diffère de celui défini sur Vercel (variable d'environnement CRON_SECRET)."; exit 1 ;;
            *) echo "::error::La route a répondu HTTP $status"; exit 1 ;;
          esac
